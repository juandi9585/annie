<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El jardín digital de Annie</title>

<!-- El preview del enlace habla del jardín, nunca de un regalo concreto:
     cada regalo nuevo se manda con su propio enlace y su sorpresa intacta. -->
<meta name="description" content="Todos tus regalos, en un solo lugar.">
<meta property="og:type" content="website">
<meta property="og:title" content="El jardín digital de Annie">
<meta property="og:description" content="Todos tus regalos, en un solo lugar.">
<meta property="og:url" content="https://juandi9585.github.io/annie/">
<meta name="theme-color" content="#a6cfe9">

<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/fraunces-display.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/fraunces-texto.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="jardin.css">
</head>
<body>

<main class="pagina">

  <header class="cabecera">
    <h1>El jardín digital de Annie</h1>
    <p>Cada planta es un regalo. Toca una para abrirla.</p>
  </header>

  <div class="sol" aria-hidden="true"></div>

  <!-- Aquí crece el jardín: lo dibuja jardin.js a partir de la lista de
       abajo, una franja de césped por año, el más nuevo delante. -->
  <div class="loma" id="loma"></div>

</main>

<!-- La polaroid que sube al tocar una planta. -->
<dialog class="polaroid" id="polaroid" aria-labelledby="polaroidNombre">
  <form method="dialog" class="polaroid__cerrar">
    <button type="submit" aria-label="Volver al jardín"></button>
  </form>
  <img class="polaroid__foto" id="polaroidFoto" alt="" hidden>
  <p class="polaroid__fecha" id="polaroidFecha"></p>
  <h2 class="polaroid__nombre" id="polaroidNombre"></h2>
  <p class="polaroid__frase" id="polaroidFrase" hidden></p>
  <a class="polaroid__abrir" id="polaroidAbrir" href="#">Abrir el regalo</a>
</dialog>

<!-- ════════════════════════════════════════════════════════════════════════
     LOS REGALOS.  Lo único que hay que tocar para sembrar uno nuevo.

     Copia una de las entradas, pon una coma entre entradas, y rellena:

       fecha     "AAAA-MM-DD". Decide en qué año (franja) crece y su orden.
       nombre    Lo que se lee bajo la planta y en la polaroid.
       enlace    Adónde lleva "Abrir el regalo". Una carpeta de este sitio
                 ("aniversario/") o una web de fuera ("https://...").
       recuerdo  (sólo si el enlace es de fuera) la carpeta de este sitio con
                 la copia que no depende de nadie. El jardín la ofrece si la
                 web de fuera algún día deja de existir.
       especie   tulipan · flor · girasol · lavanda · margarita · rosa ·
                 campanilla. Cuál le toca a cada regalo lo eliges tú.
       foto      (opcional) la foto de la polaroid, relativa a esta carpeta.
       frase     (opcional) una línea bajo el nombre, en la polaroid.

     La planta más nueva brilla sola: no hay que marcarla. La posición de
     cada planta sale de su fecha y su nombre, así que no cambia entre
     visitas ni al añadir otras.
     ════════════════════════════════════════════════════════════════════ -->
<script type="application/json" id="regalos">
[
  {
    "fecha": "2026-04-18",
    "nombre": "Mesiversario",
    "enlace": "mesiversario/",
    "especie": "tulipan",
    "foto": "assets/portada/mesiversario.webp",
    "frase": "¿Quieres saber cuánto te amo?"
  },
  {
    "fecha": "2026-08-18",
    "nombre": "Una flor",
    "enlace": "flor/",
    "especie": "flor",
    "foto": "assets/fotos/03-ramo.webp",
    "frase": "¡Felices 10 meses, Annie!"
  },
  {
    "fecha": "2026-09-22",
    "nombre": "Tu cumple",
    "enlace": "cumple/recuerdo/",
    "especie": "girasol",
    "foto": "assets/portada/cumple.webp",
    "frase": "¡Feliz cumpleaños, Annie!"
  },
  {
    "fecha": "2026-10-18",
    "nombre": "Annieversario",
    "enlace": "annieversario/",
    "especie": "rosa",
    "foto": "assets/portada/annieversario.webp",
    "frase": "Together in every universe"
  }
]
</script>
<!-- ═══════════════════════════ fin de los regalos ═══════════════════════ -->

<div class="grano" aria-hidden="true"></div>

<script src="jardin.js"></script>
</body>
</html>
