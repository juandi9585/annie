<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Generador de assets/preview.jpg</title>
<!--
  Página auxiliar para regenerar la imagen del preview del enlace.
  NO forma parte de la página que ve Annie.

  No dibuja nada por su cuenta: mete index.html en un iframe con el ancho de un
  móvil (600px, o sea la misma disposición que verá ella), lo amplía x2 y lo
  sube, de forma que por la ventana de 1200x630 se vea la mitad de abajo de la
  escena. Así el preview no puede desincronizarse del diseño real, y ni el sol
  ni la semilla salen diminutos dentro de una tarjeta de chat.

  Muestra la escena en reposo — semilla y "tócala", sin flor y sin mensaje —
  porque si la tarjeta lo enseñara todo, abrir la página ya no descubriría nada.

  Uso — desde la raíz del proyecto:
    python -m http.server 8000
    chrome --headless=new --disable-gpu --hide-scrollbars \
           --run-all-compositor-stages-before-draw --virtual-time-budget=8000 \
           --window-size=1200,630 --screenshot=assets/preview.jpg \
           http://127.0.0.1:8000/tools/preview.html

  Vuelve a ejecutarlo cada vez que cambies el diseño o assets/flower.json.
-->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  /* 600x500 ampliado x2 son 1200x1000; el desplazamiento de -370 deja a la
     vista la franja de abajo. El iframe tiene su propio viewport, así que
     dentro manda la disposición de móvil. */
  #pagina {
    border: 0;
    width: 600px;
    height: 500px;
    transform: translateY(-370px) scale(2);
    transform-origin: 0 0;
  }
</style>
</head>
<body>
<iframe id="pagina" src="../index.html"></iframe>
<script>
// El fundido de entrada de .escena no termina de forma fiable bajo el tiempo
// virtual de headless: se anula para que la captura salga siempre completa.
document.getElementById('pagina').addEventListener('load', function () {
  var s = this.contentDocument.createElement('style');
  s.textContent = '.escena{transition:none!important}';
  this.contentDocument.head.appendChild(s);
});
</script>
</body>
</html>
